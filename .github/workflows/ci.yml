name: CI

on:
  push:
    branches: [main, "build/**"]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm run typecheck
      - run: pnpm run test
      - run: pnpm run build
    # Note: `pnpm test:e2e` performs genuine XRPL Testnet transactions
    # (needs funded wallet seeds); it runs from `pnpm xrpl:setup` + `pnpm dev`
    # locally / in the demo environment, not in this lint-and-unit CI job.
