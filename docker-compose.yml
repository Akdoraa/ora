services:
  postgres:
    image: postgres:16-alpine
    container_name: ora-postgres
    environment:
      POSTGRES_USER: ora
      POSTGRES_PASSWORD: ora
      POSTGRES_DB: ora
    ports:
      - "5432:5432"
    volumes:
      - ora-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ora -d ora"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  ora-pgdata:
